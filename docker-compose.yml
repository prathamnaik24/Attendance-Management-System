services:

  # ─── PostgreSQL 16 Database ─────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: attendance_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-attendance_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      # Exposed on host so you can connect from pgAdmin or DBeaver while developing
      - "${DB_PORT:-5432}:5432"
    volumes:
      # Named volume — your data persists between `docker-compose down` and `up`
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Backend will not start until this passes
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-attendance_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── Backend (Node.js + Express) ────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: attendance_backend
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    env_file:
      # Loads all variables from root .env file
      - .env
    environment:
      # IMPORTANT: Inside Docker, services talk to each other by service name.
      # DB_HOST must be "postgres" (the service name above), NOT "localhost".
      DB_HOST: postgres
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-attendance_db}
    depends_on:
      postgres:
        # Backend only starts once the DB healthcheck passes
        condition: service_healthy
    volumes:
      # Mount source for hot reload — nodemon watches for changes
      - ./backend:/app
      # Anonymous volume prevents host node_modules from overwriting
      # the container's node_modules (they may differ for linux vs windows)
      - attendance_backend_modules:/app/node_modules

  # ─── Frontend (React + Vite) ────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: attendance_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    env_file:
      - .env
    depends_on:
      - backend
    volumes:
      # Mount source for Vite HMR (hot module replacement)
      - ./frontend:/app
      - attendance_frontend_modules:/app/node_modules

# ─── Named Volumes ─────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    name: attendance_postgres_data   # Persists your database data

  attendance_backend_modules:
    name: attendance_backend_modules

  attendance_frontend_modules:
    name: attendance_frontend_modules
